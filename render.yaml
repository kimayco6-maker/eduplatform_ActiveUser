services:
  - type: web
    name: lms-active-user-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ACTIVE_USER_SECRET
        sync: false
      - key: ACTIVE_USER_TTL_SECONDS
        value: "9"
      - key: ACTIVE_USER_EXPIRY_INTERVAL_SECONDS
        value: "3"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
